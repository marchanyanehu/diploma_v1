services:
  frontend:
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/styles.css:/usr/share/nginx/html/styles.css:ro
      - ./frontend/app.js:/usr/share/nginx/html/app.js:ro
      - ./frontend/config.js:/usr/share/nginx/html/config.js:ro
      # Override config with local version (no SSL)
      - ./nginx.local.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      # Expose only port 80 locally.
      # Port 443 is technically defined in base, 
      # but we don't bind it here.
      # Docker Compose merge usually keeps lists unique or merged.
      # To strictly remove 443 binding, we would restart list, 
      # but simply not using it is fine if no process listens on ssl.
      # The local nginx conf only listens on 80.
      # If host port 443 is free, binding it is fine (it will just return connection closed).

  certbot:
    # Disable certbot locally by changing entrypoint to immediate exit
    entrypoint: ["/bin/sh", "-c", "echo 'Certbot disabled locally'; exit 0"]
    restart: "no"
