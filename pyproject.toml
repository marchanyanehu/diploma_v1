[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-web-data-aggregator"
version = "0.1.0"
description = "Intelligent System for Web Data Aggregation"
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sqlalchemy>=2.0.32,<3.0.0",
    "alembic>=1.13.2,<2.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "celery[redis]>=5.4.0,<6.0.0",
    "redis>=5.0.4,<6.0.0",
    "playwright>=1.44.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
    "openai>=1.45.0,<2.0.0",
    "anthropic>=0.34.0,<1.0.0",
    "litellm>=1.52.0,<2.0.0",
    "google-generativeai>=0.8.0,<1.0.0",
    "pydantic[email]>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "python-multipart>=0.0.9,<0.1.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-mock>=3.14.0,<4.0.0"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
    "ignore:utcfromtimestamp.*is deprecated:DeprecationWarning",
    "ignore:utcnow.*is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["services", "shared"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
python_version = "3.11"
