[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-web-data-aggregator"
version = "0.1.0"
description = "Intelligent System for Web Data Aggregation based on Natural Language Processing using Large Language Models"
dependencies = [
    # Web Framework
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",

    # Database
    "sqlalchemy>=2.0.32,<3.0.0",
    "alembic>=1.13.2,<2.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",

    # Async Task Queue
    "celery[redis]>=5.4.0,<6.0.0",
    "redis>=5.0.4,<6.0.0",

    # Web Scraping
    "playwright>=1.44.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",

    # LLM Integration
    "openai>=1.45.0,<2.0.0",
    "anthropic>=0.34.0,<1.0.0",
    "litellm>=1.52.0,<2.0.0",
    "google-generativeai>=0.8.0,<1.0.0",

    # Data Validation & Serialization
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",

    # Utilities
    "python-multipart>=0.0.9,<0.1.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]
    # Web Scraping
    "playwright>=1.44.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",

    # LLM Integration
    # Keep openai & litellm in sync: litellm >=1.52 requires openai >=1.45
    "openai>=1.45.0,<2.0.0",
    "anthropic>=0.34.0,<1.0.0",
    "litellm>=1.52.0,<2.0.0",
    # google-generativeai 0.7.x pulls google-ai-generativelanguage >=0.6.18 resolving langchain-google-genai constraint
    "google-generativeai>=0.7.0,<0.8.0",

    # Data Validation & Serialization
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",

    # Utilities
    "python-multipart>=0.0.9,<1.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "httpx>=0.27.0,<1.0.0",  # For TestClient

    # Code Quality
    "ruff>=0.5.0,<0.6.0",
    "black>=24.4.0,<25.0.0",
    "mypy>=1.10.0,<2.0.0",
    "pre-commit>=3.7.0,<4.0.0",

    # Development Tools
    "ipython>=8.25.0,<9.0.0",
    "jupyter>=1.0.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/yanmarchan/intelligent-web-data-aggregator"
Repository = "https://github.com/yanmarchan/intelligent-web-data-aggregator.git"
Issues = "https://github.com/yanmarchan/intelligent-web-data-aggregator/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "shared*"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "playwright.*",
    "alembic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = [
    "tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["services", "shared"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
