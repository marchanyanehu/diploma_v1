services:
  postgres:
    image: postgres:15-alpine
    container_name: diploma_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-diploma_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-diploma_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: diploma_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: diploma_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-diploma_db}
      DB_USER: ${DB_USER:-app_write}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-strong-app-write}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      DEBUG: ${DEBUG:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-baseten}
      LLM_MODEL: ${LLM_MODEL:-baseten/deepseek-ai/DeepSeek-V3.2}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-gemini}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gemini-2.0-flash}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      BASETEN_API_KEY: ${BASETEN_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    command: ["python", "-m", "uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  headless_worker:
    build:
      context: .
      dockerfile: services/headless_worker/Dockerfile
    container_name: diploma_headless_worker
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-diploma_db}
      DB_USER: ${DB_USER:-app_write}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-strong-app-write}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      PLAYWRIGHT_NAV_TIMEOUT_MS: ${PLAYWRIGHT_NAV_TIMEOUT_MS:-30000}
      PLAYWRIGHT_SETTLE_DELAY_MS: ${PLAYWRIGHT_SETTLE_DELAY_MS:-500}
      PLAYWRIGHT_MAX_RETRIES: ${PLAYWRIGHT_MAX_RETRIES:-2}
      PLAYWRIGHT_RETRY_BACKOFF_MS: ${PLAYWRIGHT_RETRY_BACKOFF_MS:-1000}
      PLAYWRIGHT_LOCALE: ${PLAYWRIGHT_LOCALE:-en-US}
      PLAYWRIGHT_TZ: ${PLAYWRIGHT_TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    shm_size: 1gb
    restart: unless-stopped
    command: ["celery", "-A", "shared.celery_app.celery_app", "worker", "--loglevel=info", "-Q", "fetching_queue"]

  ai_worker:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: diploma_ai_worker
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-diploma_db}
      DB_USER: ${DB_USER:-app_write}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-strong-app-write}
      LLM_PROVIDER: ${LLM_PROVIDER:-baseten}
      LLM_MODEL: ${LLM_MODEL:-baseten/deepseek-ai/DeepSeek-V3.2}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-gemini}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-gemini-2.0-flash}
      LLM_REQUEST_TIMEOUT_S: ${LLM_REQUEST_TIMEOUT_S:-60}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      BASETEN_API_KEY: ${BASETEN_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    restart: unless-stopped
    command: ["celery", "-A", "shared.celery_app.celery_app", "worker", "--loglevel=info", "-Q", "ai_queue"]

  scheduler:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: diploma_scheduler
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-diploma_db}
      DB_USER: ${DB_USER:-app_write}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-strong-app-write}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
    restart: unless-stopped
    command: ["celery", "-A", "shared.celery_app.celery_app", "beat", "--loglevel=info"]

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: diploma_network
